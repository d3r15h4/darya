<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | DARYA by Derisha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-solid>

<section class="page-hero">
  <h1>Contact Us</h1>
  <p>Questions about an order, sizing or delivery? Send us a message.</p>
</section>

<section class="section white">
  <div class="contact-wrap">
    <div>
      <h2>Get in touch</h2>
      <p>We reply to every message within 2 working days.</p>
      <p>Email: hello@darya.example</p>
      <p>Free UK delivery on orders over £75.</p>
    </div>
    <form class="contact-form">
      <input type="text" placeholder="Your name" aria-label="Your name" required>
      <input type="email" placeholder="Your email" aria-label="Your email" required>
      <textarea placeholder="How can we help?" aria-label="Message" required></textarea>
      <button type="submit" class="button dark">Send message</button>
    </form>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
